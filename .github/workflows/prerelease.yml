name: Pre-Release

on:
  pull_request:
    branches: ["main", "main-dev"]

env:
  BUILD_TYPE: Release
  PYTHONUTF8: 1

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read

jobs:
  test_python:
    name: Test Python
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3

      - name: Install dependencies
        run: |
          uv pip install --system -e ".[onnx]"
          uv pip install --system pytest

        # When running tests in CI, limit ourselves to the small model tests
      - name: Test with PyTest
        run: pytest python/scripts/ -s -x -Wd -v -k small

  test_javascript:
    name: Test JavaScript
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20

      # TODO: JavaScript tests pass, but ONNX throws a memory error on exit
      # - name: Build JavaScript
      #   run: npm ci
      # - name: Test JavaScript
      #   run: npm test

  test_swift:
    name: Test Swift
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Build
        run: swift build
      - name: Run tests
        run: swift test