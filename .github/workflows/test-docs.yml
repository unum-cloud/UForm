name: Test Docs

on:
  workflow_call:

permissions:
  contents: read

env:
  PYTHONUTF8: 1
  PYTHONFAULTHANDLER: 1
  UBUNTU_CODECS: >-
    libturbojpeg0-dev libpng-dev libwebp-dev libavformat-dev libavcodec-dev libavutil-dev libswresample-dev
    libswscale-dev

jobs:
  build_docs:
    name: Build Docs
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      - name: Install Codecs
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build $UBUNTU_CODECS
      - name: Set Up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install Doxygen
        run: |
          curl -sSfL https://www.doxygen.nl/files/doxygen-1.18.0.linux.bin.tar.gz | tar -xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/doxygen-1.18.0/bin" >> "$GITHUB_PATH"
      - name: Install Sphinx
        run: pip install -r docs/requirements.txt
      - name: Install UForm from the Checkout
        env:
          CC: clang
          CXX: clang++
        run: pip install .
      - name: Build Docs
        run: cd docs && doxygen conf.dox && sphinx-build -M html . ../build/docs -W
      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./build/docs/html
