name: Test Python

on:
  workflow_call:

permissions:
  contents: read

env:
  PYTHONUTF8: 1
  PYTHONFAULTHANDLER: 1
  PYTHON_VERSION: "3.12"
  # The host codecs the engine decodes images, video and audio with; WebAssembly builds take decoded media instead.
  UBUNTU_CODECS: >-
    libturbojpeg0-dev libpng-dev libwebp-dev libavformat-dev libavcodec-dev libavutil-dev libswresample-dev
    libswscale-dev

jobs:
  test_python_ubuntu:
    name: Test Python on Ubuntu with the CPU Library
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      - name: Install Codecs
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build $UBUNTU_CODECS
      # The inference parity test loads the tiny checkpoint the C suites' fixture writes.
      - name: Write the Tiny Checkpoint
        run: |
          cmake --preset library -D UFORM_BUILD_TEST=ON
          cmake --build --preset library --target uform_tiny_checkpoint
          ctest --test-dir build_library --output-on-failure --tests-regex '^uform_tiny_checkpoint$'
      - name: Set Up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Build Python
        env:
          CC: clang
          CXX: clang++
        run: |
          python -m pip install --upgrade pip
          python -m pip install --group test .
      - name: Test Python
        env:
          UFORM_TEST_CHECKPOINT: ${{ github.workspace }}/build_library/tiny.safetensors
        run: python -X faulthandler -m pytest -x test/python

  test_data_scripts:
    name: Test Data Scripts
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      - name: Set Up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --group test
      - name: Test Data Scripts
        run: python -X faulthandler -m pytest -x scripts/data

  # The native Python builds fail in minutes, before the cibuildwheel jobs start.
  wheels:
    name: Build Python Wheels
    needs: test_python_ubuntu
    uses: ./.github/workflows/build-wheels.yml
    with:
      smoke: true
