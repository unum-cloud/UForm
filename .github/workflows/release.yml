name: Release

on:
  push:
    branches: ["main"]

env:
  GH_TOKEN: ${{ secrets.SEMANTIC_RELEASE_TOKEN }}
  PYTHONUTF8: 1
  PYTHON_VERSION: "3.12"
  NODE_VERSION: 22
  EMSCRIPTEN_VERSION: 6.0.9
  UBUNTU_CODECS: >-
    libjpeg-turbo8-dev libpng-dev libwebp-dev libavformat-dev libavcodec-dev libavutil-dev libswresample-dev
    libswscale-dev
  MACOS_CODECS: jpeg-turbo libpng webp ffmpeg

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  # The files the release commit bumps that land in the Swift artifacts: the library's version string and the bundle's.
  bump_swift_version:
    name: Bump Swift Artifacts Version
    if: github.repository == 'unum-cloud/UForm'
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Bump Version
        uses: ashvardanian/tinysemver@v3
        with:
          version-file: "VERSION"
          update-version-in: |
            src/types.cpp:return "(\d+\.\d+\.\d+(?:-rc\.\d+)?)"
            CMakeLists.txt:VERSION (\d+\.\d+\.\d+(?:-rc\.\d+)?)
          dry-run: "false"
      - name: Upload Bumped Files
        uses: actions/upload-artifact@v7
        with:
          name: swift-version
          path: |
            VERSION
            CMakeLists.txt
            src/types.cpp
          if-no-files-found: error
          retention-days: 1

  # Each build adds its slice, and `lipo` joins the architectures of one SDK. The simulators' runtimes and the 32-bit
  # watchOS one lack the `__sme_memset` routine streaming SME code calls, so those go without NumKong's SME kernels.
  build_swift_xcframework:
    name: Build Swift XCFramework
    needs: bump_swift_version
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Codecs
        run: brew install $MACOS_CODECS
      - name: Take the Release Version
        uses: actions/download-artifact@v8
        with:
          name: swift-version
          path: .
      - name: Build Every Apple Slice
        run: |
          set -euo pipefail
          no_sme="-D NUMKONG_TARGET_SME=0 -D NUMKONG_TARGET_SMEF64=0 -D NUMKONG_TARGET_SMEBI32=0"
          slice() {
            local name=$1
            shift
            cmake -S . -B "build_$name" --preset swift -D UFORM_SWIFT_DIRECTORY="$PWD/build_swift" "$@"
            cmake --build "build_$name"
          }
          for arch in arm64 x86_64; do
            slice "macos_$arch" -D CMAKE_OSX_ARCHITECTURES=$arch
            slice "catalyst_$arch" -D UFORM_SWIFT_SDK=maccatalyst -D CMAKE_OSX_ARCHITECTURES=$arch \
              -D "CMAKE_C_FLAGS=-target $arch-apple-ios18.0-macabi" -D "CMAKE_CXX_FLAGS=-target $arch-apple-ios18.0-macabi"
            slice "iossim_$arch" -D CMAKE_SYSTEM_NAME=iOS -D CMAKE_OSX_SYSROOT=iphonesimulator \
              -D UFORM_SWIFT_SDK=iphonesimulator -D CMAKE_OSX_ARCHITECTURES=$arch -D CMAKE_OSX_DEPLOYMENT_TARGET=18.0 $no_sme
            slice "tvossim_$arch" -D CMAKE_SYSTEM_NAME=tvOS -D CMAKE_OSX_SYSROOT=appletvsimulator \
              -D UFORM_SWIFT_SDK=appletvsimulator -D CMAKE_OSX_ARCHITECTURES=$arch -D CMAKE_OSX_DEPLOYMENT_TARGET=18.0 $no_sme
            slice "watchsim_$arch" -D CMAKE_SYSTEM_NAME=watchOS -D CMAKE_OSX_SYSROOT=watchsimulator \
              -D UFORM_SWIFT_SDK=watchsimulator -D CMAKE_OSX_ARCHITECTURES=$arch -D CMAKE_OSX_DEPLOYMENT_TARGET=11.0 $no_sme
            slice "xrsim_$arch" -D CMAKE_SYSTEM_NAME=visionOS -D CMAKE_OSX_SYSROOT=xrsimulator \
              -D UFORM_SWIFT_SDK=xrsimulator -D CMAKE_OSX_ARCHITECTURES=$arch -D CMAKE_OSX_DEPLOYMENT_TARGET=2.0 $no_sme
          done
          slice watchos_arm64_32 -D CMAKE_SYSTEM_NAME=watchOS -D CMAKE_OSX_SYSROOT=watchos -D UFORM_SWIFT_SDK=watchos \
            -D CMAKE_OSX_ARCHITECTURES=arm64_32 -D CMAKE_OSX_DEPLOYMENT_TARGET=11.0 $no_sme
          slice watchos_arm64 -D CMAKE_SYSTEM_NAME=watchOS -D CMAKE_OSX_SYSROOT=watchos -D UFORM_SWIFT_SDK=watchos \
            -D CMAKE_OSX_ARCHITECTURES=arm64 -D CMAKE_OSX_DEPLOYMENT_TARGET=11.0
          slice ios -D CMAKE_SYSTEM_NAME=iOS -D CMAKE_OSX_SYSROOT=iphoneos -D UFORM_SWIFT_SDK=iphoneos \
            -D CMAKE_OSX_ARCHITECTURES=arm64 -D CMAKE_OSX_DEPLOYMENT_TARGET=18.0
          slice tvos -D CMAKE_SYSTEM_NAME=tvOS -D CMAKE_OSX_SYSROOT=appletvos -D UFORM_SWIFT_SDK=appletvos \
            -D CMAKE_OSX_ARCHITECTURES=arm64 -D CMAKE_OSX_DEPLOYMENT_TARGET=18.0
          slice xros -D CMAKE_SYSTEM_NAME=visionOS -D CMAKE_OSX_SYSROOT=xros -D UFORM_SWIFT_SDK=xros \
            -D CMAKE_OSX_ARCHITECTURES=arm64 -D CMAKE_OSX_DEPLOYMENT_TARGET=2.0
          (cd build_swift && zip -qry ../UFormC.xcframework.zip UFormC.xcframework)
      - name: Upload XCFramework
        uses: actions/upload-artifact@v7
        with:
          name: swift-xcframework
          path: UFormC.xcframework.zip
          if-no-files-found: error
          retention-days: 7

  build_swift_linux:
    name: Build Swift Artifact Bundle for Linux ${{ matrix.arch }}
    needs: bump_swift_version
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-26.04-arm' || 'ubuntu-26.04' }}
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Codecs
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build $UBUNTU_CODECS
      - name: Take the Release Version
        uses: actions/download-artifact@v8
        with:
          name: swift-version
          path: .
      - name: Build Artifact Bundle
        run: |
          cmake --preset swift
          cmake --build --preset swift
      - name: Upload Artifact Bundle
        uses: actions/upload-artifact@v7
        with:
          name: swift-part-linux-${{ matrix.arch }}
          path: build_swift/UFormC.artifactbundle
          if-no-files-found: error
          retention-days: 1

  # Each part's variants go through the same CMake script that wrote them, into one bundle.
  merge_swift_artifact_bundle:
    name: Merge Swift Artifact Bundle
    needs: build_swift_linux
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Download Artifact Bundle Parts
        uses: actions/download-artifact@v8
        with:
          pattern: swift-part-*
          path: parts
      - name: Merge Artifact Bundle Parts
        run: |
          set -euo pipefail
          for part in parts/*; do
            version=$(jq -r '.artifacts.UFormC.version' "$part/info.json")
            jq -r '.artifacts.UFormC.variants[] | [.path, (.supportedTriples | join(","))] | @tsv' "$part/info.json" |
              while IFS=$'\t' read -r path triples; do
                cmake -D NUMKONG_SWIFT_MODULE=UFormC -D NUMKONG_SWIFT_ARCHIVE="$part/$path" \
                  -D NUMKONG_SWIFT_HEADERS="$part/include" -D NUMKONG_SWIFT_DIRECTORY="$PWD/merged" \
                  -D NUMKONG_SWIFT_TRIPLES="$triples" -D NUMKONG_SWIFT_VERSION="$version" \
                  -P numkong/cmake/numkong_swift_artifact.cmake
              done
          done
          (cd merged && zip -qry ../UFormC.artifactbundle.zip UFormC.artifactbundle)
      - name: Upload Artifact Bundle
        uses: actions/upload-artifact@v7
        with:
          name: swift-artifactbundle
          path: UFormC.artifactbundle.zip
          if-no-files-found: error
          retention-days: 7

  # `Package.swift` names the Swift artifacts by URL and checksum, so the release commit carries both and the
  # artifacts join the release it creates.
  versioning:
    name: Update Version
    # Every other job needs this one, so a private fork never tags, releases or publishes.
    if: github.repository == 'unum-cloud/UForm'
    needs: [build_swift_xcframework, merge_swift_artifact_bundle]
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download Swift Artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: swift-{xcframework,artifactbundle}
          path: ${{ runner.temp }}/swift
          merge-multiple: true
      - name: Write Swift Checksums
        run: |
          apple=$(sha256sum "$RUNNER_TEMP"/swift/*.xcframework.zip | cut -c -64)
          portable=$(sha256sum "$RUNNER_TEMP"/swift/*.artifactbundle.zip | cut -c -64)
          sed -i "s/^let appleChecksum = .*/let appleChecksum = \"$apple\"/" Package.swift
          sed -i "s/^let portableChecksum = .*/let portableChecksum = \"$portable\"/" Package.swift
      # `pyproject.toml` reads the version from `VERSION`, so it carries no copy to rewrite.
      - name: Run TinySemVer
        uses: ashvardanian/tinysemver@v3
        with:
          verbose: "true"
          version-file: "VERSION"
          update-version-in: |
            package.json:"version": "(\d+\.\d+\.\d+(?:-rc\.\d+)?)"
            CITATION.cff:^version: (\d+\.\d+\.\d+(?:-rc\.\d+)?)
            Cargo.toml:^version = "(\d+\.\d+\.\d+(?:-rc\.\d+)?)"
            javascript/uform.test.js:version\(\), "(\d+\.\d+\.\d+(?:-rc\.\d+)?)"
            src_stub/types.cpp:return "(\d+\.\d+\.\d+(?:-rc\.\d+)?)"
            src/types.cpp:return "(\d+\.\d+\.\d+(?:-rc\.\d+)?)"
            CMakeLists.txt:VERSION (\d+\.\d+\.\d+(?:-rc\.\d+)?)
            Package.swift:releases/download/v(\d+\.\d+\.\d+(?:-rc\.\d+)?)
          dry-run: "false"
          push: "true"
          create-release: "true"
          github-token: ${{ secrets.SEMANTIC_RELEASE_TOKEN }}
      - name: Upload Swift Artifacts
        run: git diff --quiet HEAD~1 HEAD -- VERSION || gh release upload "v$(cat VERSION)" "$RUNNER_TEMP"/swift/*.zip

  rebase:
    name: Rebase Dev Branch
    needs: versioning
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Perform Rebase
        run: |
          git fetch origin main
          git checkout main-dev
          git rebase origin/main
      - name: Push Changes
        uses: CasperWA/push-protected@v2
        with:
          token: ${{ secrets.SEMANTIC_RELEASE_TOKEN }}
          branch: main-dev
          unprotect_reviews: True
          force: True

  # CPU wheels: the extension links the C library for the host alone, with the system codecs bundled by the repair step.
  # The manylinux_2_34 images carry EPEL's FFmpeg, new enough for the channel-layout API the audio decoder calls.
  build_wheels:
    name: Build Python Wheels for ${{ matrix.os }} cp${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    needs: versioning
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, ubuntu-26.04-arm, macos-15, macos-15-intel]
        python-version: ["312", "313", "313t", "314", "314t"]
    steps:
      - name: Check Out Refreshed Version
        uses: actions/checkout@v7
        with:
          ref: "main"
      - name: Set Up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install Codecs
        if: runner.os == 'macOS'
        run: |
          brew install $MACOS_CODECS
          echo "CMAKE_PREFIX_PATH=$(brew --prefix);$(brew --prefix jpeg-turbo)" >> "$GITHUB_ENV"
      - name: Install cibuildwheel
        run: python -m pip install cibuildwheel
      # The suites need the tiny checkpoint the CMake fixture writes, so a wheel proves only that it imports.
      - name: Build Wheels
        run: cibuildwheel --output-dir wheelhouse
        env:
          CIBW_BUILD: cp${{ matrix.python-version }}-*
          CIBW_ENABLE: cpython-freethreading
          CIBW_ARCHS: native
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_34
          CIBW_MANYLINUX_AARCH64_IMAGE: manylinux_2_34
          CIBW_BEFORE_ALL_LINUX: >-
            if command -v apk; then
            apk add libjpeg-turbo-dev libpng-dev libwebp-dev ffmpeg-dev;
            else
            dnf install -y epel-release && dnf config-manager --set-enabled crb &&
            dnf install -y libjpeg-turbo-devel libpng-devel libwebp-devel libavcodec-free-devel
            libavformat-free-devel libavutil-free-devel libswresample-free-devel libswscale-free-devel;
            fi
          # Homebrew bottles target the runner's own macOS, which the wheels then require.
          CIBW_ENVIRONMENT_MACOS: MACOSX_DEPLOYMENT_TARGET=15.0
          CIBW_TEST_COMMAND: python -c "import uform; print(uform.version(), uform.capabilities_compiled())"
      - name: Upload Wheels
        uses: actions/upload-artifact@v7
        with:
          name: cibw-wheels-${{ matrix.os }}-${{ matrix.python-version }}
          path: ./wheelhouse/*.whl
          overwrite: true

  publish_python:
    name: Publish Python
    needs: build_wheels
    runs-on: ubuntu-26.04
    environment:
      name: pypi
      url: https://pypi.org/p/uform
    permissions:
      id-token: write
    steps:
      - name: Download Wheels
        uses: actions/download-artifact@v8
        with:
          pattern: cibw-*
          path: dist
          merge-multiple: true
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          verbose: true
          print-hash: true

  build_javascript:
    name: Build JavaScript Addon for ${{ matrix.os }}
    needs: versioning
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, ubuntu-26.04-arm, macos-26]
    steps:
      - name: Check Out Refreshed Version
        uses: actions/checkout@v7
        with:
          ref: "main"
      - name: Install Codecs on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build $UBUNTU_CODECS
      - name: Install Codecs on macOS
        if: runner.os == 'macOS'
        run: |
          brew install ninja $MACOS_CODECS
          echo "CMAKE_PREFIX_PATH=$(brew --prefix);$(brew --prefix jpeg-turbo)" >> "$GITHUB_ENV"
      - name: Set Up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install Dependencies
        run: npm install --ignore-scripts
      - name: Prebuild
        run: npm run prebuild
      - name: Upload Prebuilds
        uses: actions/upload-artifact@v7
        with:
          name: prebuilds-${{ matrix.os }}
          path: prebuilds
          retention-days: 1

  build_wasm:
    name: Build WASM Module
    needs: versioning
    runs-on: ubuntu-26.04
    steps:
      - name: Check Out Refreshed Version
        uses: actions/checkout@v7
        with:
          ref: "main"
      - name: Set Up Emscripten
        uses: mymindstorm/setup-emsdk@v16
        with:
          version: ${{ env.EMSCRIPTEN_VERSION }}
      - name: Set Up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Build and Test C
        run: |
          cmake --preset wasm32_emscripten -D UFORM_BUILD_TEST=ON
          cmake --build --preset wasm32_emscripten
          ctest --test-dir build_wasm32_emscripten --output-on-failure
      - name: Build the Module
        run: npm run build-wasm
      - name: Package the Module
        run: |
          version=$(cat VERSION)
          tar -czf "uform_wasm32_emscripten_${version}.tar.gz" -C javascript/dist/wasm uform.mjs uform.wasm
      - name: Upload the Module for npm
        uses: actions/upload-artifact@v7
        with:
          name: wasm-module
          path: javascript/dist/wasm
          retention-days: 1
      - name: Upload the Module to the Release
        uses: xresloader/upload-to-github-release@v1.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          file: "uform_wasm32_emscripten_*.tar.gz"
          update_latest_release: true

  publish_javascript:
    name: Publish JavaScript
    needs: [build_javascript, build_wasm]
    runs-on: ubuntu-26.04
    environment:
      name: npm-uform
      url: https://www.npmjs.com/package/@unum-cloud/uform
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check Out Refreshed Version
        uses: actions/checkout@v7
        with:
          ref: "main"
      - name: Set Up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: "https://registry.npmjs.org"
      - name: Download Prebuilds
        uses: actions/download-artifact@v8
        with:
          pattern: prebuilds-*
          merge-multiple: true
          path: prebuilds
      - name: Install Dependencies
        run: npm install --ignore-scripts
      - name: Build JavaScript
        run: npm run build-js
      - name: Download the WASM Module
        uses: actions/download-artifact@v8
        with:
          name: wasm-module
          path: javascript/dist/wasm
      - name: Publish Dry Run
        run: npm publish --dry-run
      - name: Publish
        run: npm publish --provenance --access public

  # No crate job: `Cargo.toml` says `publish = false` until the crate is ready for crates.io.

  # SwiftPM resolves the package from the tag `versioning` pushes, downloading the artifacts that release carries, so
  # publishing is proving that tag builds. The suite runs against the stub, in the pre-release checks.
  publish_swift:
    name: Publish Swift
    needs: versioning
    runs-on: macos-26
    steps:
      - name: Check Out Refreshed Version
        uses: actions/checkout@v7
        with:
          ref: "main"
      - name: Build Swift
        run: swift build

  build_docs:
    name: Build Docs
    runs-on: ubuntu-26.04
    needs: publish_python
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: "main"
      - name: Set Up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install Doxygen
        run: |
          curl -sSfL https://www.doxygen.nl/files/doxygen-1.18.0.linux.bin.tar.gz | tar -xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/doxygen-1.18.0/bin" >> "$GITHUB_PATH"
      - name: Install Sphinx
        run: pip install -r docs/requirements.txt
      - name: Install the Released UForm
        run: pip install "uform==$(cat VERSION)"
      - name: Build Docs
        run: cd docs && doxygen conf.dox && sphinx-build -M html . ../build/docs -W
      - name: Compress Docs
        run: tar -czvf docs.tar.gz build/docs/html/
      - name: Upload Docs to Release
        uses: xresloader/upload-to-github-release@v1.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          file: docs.tar.gz
          update_latest_release: true

  deploy_docs_pages:
    name: Deploy GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-26.04
    needs: build_docs
    steps:
      - name: Download Release Assets
        uses: robinraju/release-downloader@v1.13
        with:
          latest: true
          fileName: docs.tar.gz
      - name: Unpack Docs
        run: tar -xf ./docs.tar.gz
      - name: Set Up GitHub Pages
        uses: actions/configure-pages@v6
      - name: Upload Artifacts
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./build/docs/html
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
