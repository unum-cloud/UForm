name: Release

on:
  push:
    branches: ["main"]

env:
  GH_TOKEN: ${{ secrets.SEMANTIC_RELEASE_TOKEN }}
  PYTHONUTF8: 1
  PYTHON_VERSION: "3.12"
  NODE_VERSION: 22
  EMSCRIPTEN_VERSION: 6.0.9
  UBUNTU_CODECS: >-
    libjpeg-turbo8-dev libpng-dev libwebp-dev libavformat-dev libavcodec-dev libavutil-dev libswresample-dev
    libswscale-dev
  MACOS_CODECS: jpeg-turbo libpng webp ffmpeg

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  versioning:
    name: Update Version
    # Every other job needs this one, so a private fork never tags, releases or publishes.
    if: github.repository == 'unum-cloud/UForm'
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      # `pyproject.toml` reads the version from `VERSION`, so it carries no copy to rewrite.
      - name: Run TinySemVer
        uses: ashvardanian/tinysemver@v3
        with:
          verbose: "true"
          version-file: "VERSION"
          update-version-in: |
            package.json:"version": "(\d+\.\d+\.\d+(?:-rc\.\d+)?)"
            CITATION.cff:^version: (\d+\.\d+\.\d+(?:-rc\.\d+)?)
            Cargo.toml:^version = "(\d+\.\d+\.\d+(?:-rc\.\d+)?)"
            javascript/uform.test.js:version\(\), "(\d+\.\d+\.\d+(?:-rc\.\d+)?)"
            src_stub/types.cpp:return "(\d+\.\d+\.\d+(?:-rc\.\d+)?)"
            src/types.cpp:return "(\d+\.\d+\.\d+(?:-rc\.\d+)?)"
          dry-run: "false"
          push: "true"
          create-release: "true"
          github-token: ${{ secrets.SEMANTIC_RELEASE_TOKEN }}

  rebase:
    name: Rebase Dev Branch
    needs: versioning
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Perform Rebase
        run: |
          git fetch origin main
          git checkout main-dev
          git rebase origin/main
      - name: Push Changes
        uses: CasperWA/push-protected@v2
        with:
          token: ${{ secrets.SEMANTIC_RELEASE_TOKEN }}
          branch: main-dev
          unprotect_reviews: True
          force: True

  # CPU wheels: the extension links the C library for the host alone, with the system codecs bundled by the repair step.
  # The manylinux_2_34 images carry EPEL's FFmpeg, new enough for the channel-layout API the audio decoder calls.
  build_wheels:
    name: Build Python Wheels for ${{ matrix.os }} cp${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    needs: versioning
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, ubuntu-26.04-arm, macos-15, macos-15-intel]
        python-version: ["312", "313", "313t", "314", "314t"]
    steps:
      - name: Check Out Refreshed Version
        uses: actions/checkout@v7
        with:
          ref: "main"
      - name: Set Up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install Codecs
        if: runner.os == 'macOS'
        run: |
          brew install $MACOS_CODECS
          echo "CMAKE_PREFIX_PATH=$(brew --prefix);$(brew --prefix jpeg-turbo)" >> "$GITHUB_ENV"
      - name: Install cibuildwheel
        run: python -m pip install cibuildwheel
      # The suites need the tiny checkpoint the CMake fixture writes, so a wheel proves only that it imports.
      - name: Build Wheels
        run: cibuildwheel --output-dir wheelhouse
        env:
          CIBW_BUILD: cp${{ matrix.python-version }}-*
          CIBW_ENABLE: cpython-freethreading
          CIBW_ARCHS: native
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_34
          CIBW_MANYLINUX_AARCH64_IMAGE: manylinux_2_34
          CIBW_BEFORE_ALL_LINUX: >-
            if command -v apk; then
            apk add libjpeg-turbo-dev libpng-dev libwebp-dev ffmpeg-dev;
            else
            dnf install -y epel-release && dnf config-manager --set-enabled crb &&
            dnf install -y libjpeg-turbo-devel libpng-devel libwebp-devel libavcodec-free-devel
            libavformat-free-devel libavutil-free-devel libswresample-free-devel libswscale-free-devel;
            fi
          # Homebrew bottles target the runner's own macOS, which the wheels then require.
          CIBW_ENVIRONMENT_MACOS: MACOSX_DEPLOYMENT_TARGET=15.0
          CIBW_TEST_COMMAND: python -c "import uform; print(uform.version(), uform.capabilities_compiled())"
      - name: Upload Wheels
        uses: actions/upload-artifact@v7
        with:
          name: cibw-wheels-${{ matrix.os }}-${{ matrix.python-version }}
          path: ./wheelhouse/*.whl
          overwrite: true

  publish_python:
    name: Publish Python
    needs: build_wheels
    runs-on: ubuntu-26.04
    environment:
      name: pypi
      url: https://pypi.org/p/uform
    permissions:
      id-token: write
    steps:
      - name: Download Wheels
        uses: actions/download-artifact@v8
        with:
          pattern: cibw-*
          path: dist
          merge-multiple: true
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          verbose: true
          print-hash: true

  build_javascript:
    name: Build JavaScript Addon for ${{ matrix.os }}
    needs: versioning
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, ubuntu-26.04-arm, macos-26]
    steps:
      - name: Check Out Refreshed Version
        uses: actions/checkout@v7
        with:
          ref: "main"
      - name: Install Codecs on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build $UBUNTU_CODECS
      - name: Install Codecs on macOS
        if: runner.os == 'macOS'
        run: |
          brew install ninja $MACOS_CODECS
          echo "CMAKE_PREFIX_PATH=$(brew --prefix);$(brew --prefix jpeg-turbo)" >> "$GITHUB_ENV"
      - name: Set Up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install Dependencies
        run: npm install --ignore-scripts
      - name: Prebuild
        run: npm run prebuild
      - name: Upload Prebuilds
        uses: actions/upload-artifact@v7
        with:
          name: prebuilds-${{ matrix.os }}
          path: prebuilds
          retention-days: 1

  build_wasm:
    name: Build WASM Module
    needs: versioning
    runs-on: ubuntu-26.04
    steps:
      - name: Check Out Refreshed Version
        uses: actions/checkout@v7
        with:
          ref: "main"
      - name: Set Up Emscripten
        uses: mymindstorm/setup-emsdk@v16
        with:
          version: ${{ env.EMSCRIPTEN_VERSION }}
      - name: Set Up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Build and Test C
        run: |
          cmake --preset wasm32_emscripten_release -D UFORM_BUILD_TEST=ON
          cmake --build --preset wasm32_emscripten_release
          ctest --test-dir build_wasm32_emscripten_release --output-on-failure
      - name: Build the Module
        run: npm run build-wasm
      - name: Package the Module
        run: |
          version=$(cat VERSION)
          tar -czf "uform_wasm32_emscripten_${version}.tar.gz" -C javascript/dist/wasm uform.mjs uform.wasm
      - name: Upload the Module for npm
        uses: actions/upload-artifact@v7
        with:
          name: wasm-module
          path: javascript/dist/wasm
          retention-days: 1
      - name: Upload the Module to the Release
        uses: xresloader/upload-to-github-release@v1.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          file: "uform_wasm32_emscripten_*.tar.gz"
          update_latest_release: true

  publish_javascript:
    name: Publish JavaScript
    needs: [build_javascript, build_wasm]
    runs-on: ubuntu-26.04
    environment:
      name: npm-uform
      url: https://www.npmjs.com/package/@unum-cloud/uform
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check Out Refreshed Version
        uses: actions/checkout@v7
        with:
          ref: "main"
      - name: Set Up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: "https://registry.npmjs.org"
      - name: Download Prebuilds
        uses: actions/download-artifact@v8
        with:
          pattern: prebuilds-*
          merge-multiple: true
          path: prebuilds
      - name: Install Dependencies
        run: npm install --ignore-scripts
      - name: Build JavaScript
        run: npm run build-js
      - name: Download the WASM Module
        uses: actions/download-artifact@v8
        with:
          name: wasm-module
          path: javascript/dist/wasm
      - name: Publish Dry Run
        run: npm publish --dry-run
      - name: Publish
        run: npm publish --provenance --access public

  # No crate job: `Cargo.toml` says `publish = false` until the crate is ready for crates.io.

  # SwiftPM resolves the package from the tag `versioning` pushes, so publishing is proving that tag builds.
  publish_swift:
    name: Publish Swift
    needs: versioning
    runs-on: macos-26
    steps:
      - name: Check Out Refreshed Version
        uses: actions/checkout@v7
        with:
          ref: "main"
      - name: Build the Stub Library
        run: |
          cmake --preset stub_library
          cmake --build --preset stub_library --target uform_static_stub
      - name: Test Swift
        run: swift test -Xlinker -L${{ github.workspace }}/build_stub_library/stub

  # Returns with the bindings it documents.
  deploy_docs:
    name: Deploy Docs
    if: ${{ false }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-26.04
    needs: versioning
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: "main"
      - name: Install Dependencies
        run: |
          pip install sphinx furo m2r2 sphinxcontrib-googleanalytics sphinxcontrib-jquery
      - name: Set Up GitHub Pages
        uses: actions/configure-pages@v6
      - name: Install UForm from PyPI
        run: pip install uform
      - name: Build Documentation
        run: cd docs && make html
      - name: Upload Artifacts
        uses: actions/upload-pages-artifact@v5
        with:
          path: "./build/docs/html/"
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
