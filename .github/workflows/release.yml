name: Release

on:
  push:
    branches: ["main"]

env:
  GH_TOKEN: ${{ secrets.SEMANTIC_RELEASE_TOKEN }}

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  versioning:
    name: Update Version
    # Every other job needs this one, so a private fork never tags, releases or publishes.
    if: github.repository == 'unum-cloud/UForm'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run TinySemVer
        uses: ashvardanian/tinysemver@v3
        with:
          verbose: "true"
          version-file: "VERSION"
          update-version-in: |
            package.json:"version": "(\d+\.\d+\.\d+(?:-rc\.\d+)?)"
            CITATION.cff:^version: (\d+\.\d+\.\d+(?:-rc\.\d+)?)
            pyproject.toml:^version = "(\d+\.\d+\.\d+(?:-rc\.\d+)?)"
            Cargo.toml:^version = "(\d+\.\d+\.\d+(?:-rc\.\d+)?)"
          dry-run: "false"
          push: "true"
          create-release: "true"
          github-token: ${{ secrets.SEMANTIC_RELEASE_TOKEN }}

  rebase:
    name: Rebase Dev. Branch
    needs: versioning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Perform rebase
        run: |
          git fetch origin main
          git checkout main-dev
          git rebase origin/main

      - name: Push changes
        uses: CasperWA/push-protected@v2
        with:
          token: ${{ secrets.SEMANTIC_RELEASE_TOKEN }}
          branch: main-dev
          unprotect_reviews: True
          force: True

  # Returns once the Python binding sits on the C ABI in c/uform/.
  publish_python:
    name: Publish Python
    if: ${{ false }}
    runs-on: ubuntu-latest
    needs: versioning

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: "main"
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: |
          uv pip install --system build

      - name: Build package
        run: python -m build

      - name: Publish to PyPi
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          verbose: true
          print-hash: true

  # Returns once the JavaScript binding sits on the C ABI in c/uform/.
  publish_javascript:
    name: Publish JavaScript
    if: ${{ false }}
    needs: versioning
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: "main"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # TODO: JavaScript tests pass, but ONNX throws a memory error on exit
      # - name: Build and Test
      #   run: |
      #     npm ci
      #     npm test

      - name: Publish
        uses: JS-DevTools/npm-publish@v2
        with:
          token: ${{ secrets.NPM_TOKEN }}

  # Returns with the bindings it documents.
  deploy_docs:
    name: Deploy Docs
    if: ${{ false }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-22.04
    needs: versioning
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: "main"
      - name: Install dependencies
        run: |
          sudo apt update && 
          sudo apt install -y doxygen graphviz dia git && 
          pip install sphinx==5.3.0 sphinx-js==3.2.1 breathe==4.35.0 furo==2023.3.27 m2r2==0.3.3.post2 sphinxcontrib-googleanalytics==0.2.dev20220708 sphinxcontrib-jquery==4.1 && 
          npm install -g jsdoc
      - name: Setup GitHub Pages
        uses: actions/configure-pages@v2
      - name: Install UForm from PyPi
        run: pip install uform
      - name: Build documentation
        run: cd docs && make html
      - name: Upload artifacts
        uses: actions/upload-pages-artifact@v1
        with:
          # Upload entire repository
          path: "./build/docs/html/"
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v1
