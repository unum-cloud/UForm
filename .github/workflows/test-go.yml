name: Test Go

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test_go_ubuntu_gcc:
    name: Test Go on Ubuntu with GCC 16
    runs-on: ubuntu-26.04
    env: { CC: gcc-16, CXX: g++-16 }
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with: { submodules: recursive }
      - name: Set Up Go
        uses: actions/setup-go@v7
        with: { go-version: stable }
      - name: Build the Static Library
        run: |
          sudo apt-get update && sudo apt-get install -y g++-16 ninja-build
          cmake --preset relwithdebinfo -D CMAKE_C_COMPILER=gcc-16 -D CMAKE_CXX_COMPILER=g++-16 -D UFORM_BUILD_STUB=1 -D UFORM_WITH_CODECS=0
          cmake --build --preset relwithdebinfo --target uform_static_stub
      - name: Test Go
        env: { CGO_LDFLAGS: "-L${{ github.workspace }}/build_relwithdebinfo/stub" }
        run: |
          test -z "$(gofmt -l golang)"
          go vet ./golang/...
          go test -race ./golang/...
