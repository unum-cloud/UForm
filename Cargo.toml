[package]
name = "uform"
version = "4.0.0-rc.1"
edition = "2021"
rust-version = "1.100"
license = "Apache-2.0"
publish = false
description = "Multimodal encoders and their training steps over the UForm C interface"

[lib]
name = "uform"
path = "rust/uform.rs"

[dependencies]
numkong = { version = "8.0.0-rc.1", features = ["std", "parallel"] }
forkunion = "4.0.0-rc.1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
