[package]
authors = ["Ash Vardanian <info@unum.cloud>"]
description = "Pocket-sized multimodal encoders and their training steps over the UForm C interface"
edition = "2021"
rust-version = "1.100"
include = [
  "/rust/**",
  "/src/**",
  "/src_stub/**",
  "/c/**",
  "/cmake/**",
  "/CMakeLists.txt",
  "/CMakePresets.json",
  "/VERSION",
  "/build.rs",
]
license = "Apache-2.0"
name = "uform"
publish = false
repository = "https://github.com/unum-cloud/UForm"
version = "4.0.0-rc.1"

[lib]
name = "uform"
path = "rust/lib.rs"

[dependencies]
# CMake builds each crate's tree in place of downloading the revision the submodule pins.
forkunion = { version = "4.0.0-rc.1", default-features = false }
numkong = "8.0.0-rc.1"
smashtable = "1.0.0-rc.1"
stringzilla = { version = "6.0.0-rc.1", default-features = false }

# Which implementation of the C interface gets linked. Naming none links the engine for the host
# alone; the GPU features add residencies to it, and `build.rs` refuses the stub beside either.
#
# The host engine is deliberately not a feature: Cargo unions features across the dependency graph
# and never subtracts, so a named default could only be turned off by every consumer at once.
[features]
# The engine with the NVIDIA residency, the trainer and the mesh; needs a CUDA toolkit at build time.
cuda = []
# The engine with the AMD residency; needs ROCm at build time.
rocm = []
# The stand-in, which answers the same verbs over the C++ standard library alone - seconds to build,
# deterministic rows, and no codecs. For testing a caller, never for shipping.
stub = []

[build-dependencies]
# The library is CMake's to build - `build.rs` drives it rather than restating the targets and the
# per-target flags in Rust.
cmake = "0.1"
