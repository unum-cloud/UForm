[package]
authors = ["Ash Vardanian <info@unum.cloud>"]
description = "Distributed training and inference engine for multi-modal perception"
edition = "2024"
rust-version = "1.100"
include = [
  "/rust/**",
  "/src/**",
  "/src_stub/**",
  "/c/**",
  "/cmake/**",
  "/CMakeLists.txt",
  "/CMakePresets.json",
  "/VERSION",
  "/build.rs",
]
license = "Apache-2.0"
name = "uform"
links = "uform"
publish = false
homepage = "https://www.unum.cloud/docs/uform"
repository = "https://github.com/unum-cloud/UForm"
documentation = "https://www.unum.cloud/docs/uform/rust"
version = "4.0.0-rc.1"

[lib]
name = "uform"
path = "rust/lib.rs"

[[test]]
name = "allocations"
path = "rust/allocations.rs"

[dependencies]
# CMake builds each crate's tree in place of downloading the revision the submodule pins.
forkunion = { version = "4.0.0-rc.1", git = "https://github.com/ashvardanian/ForkUnion", rev = "59662d01e66ee40a87d8f5b28387a29d16c78ddd", default-features = false }
numkong = { version = "8.0.0-rc.1", git = "https://github.com/ashvardanian/NumKong", rev = "310ee417fa73bf85baaac7e707910f081427ede5" }
smashtable = { version = "1.0.0-rc.1", git = "https://github.com/ashvardanian/SmashTable", rev = "e44798287a3aca9a263ba4fd7a98076d7a803f7f" }
stringzilla = { version = "6.0.0-rc.1", git = "https://github.com/ashvardanian/StringZilla", rev = "135694cbbbb1b0fb06d807d7c1bf41596e98db82", default-features = false }

# Which implementation of the C interface gets linked. Naming none links the engine for the host
# alone; the GPU features add residencies to it, and `build.rs` refuses the stub beside either.
#
# The host engine is deliberately not a feature: Cargo unions features across the dependency graph
# and never subtracts, so a named default could only be turned off by every consumer at once.
[features]
# The engine with the NVIDIA residency, the trainer and the mesh; needs a CUDA toolkit at build time.
cuda = []
# The engine with the AMD residency; needs ROCm at build time.
rocm = []
# The engine with the Apple residency; needs macOS, and its kernels compile on each device.
metal = []
# The stand-in, which answers the same verbs over the C++ standard library alone - seconds to build,
# deterministic rows, and no codecs. For testing a caller, never for shipping.
stub = []

[build-dependencies]
# The library is CMake's to build - `build.rs` drives it rather than restating the targets and the
# per-target flags in Rust.
cmake = "0.1"
