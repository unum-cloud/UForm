[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=42"]

[project]
authors = [
    {email = "ash.vardanian@unum.cloud", name = "Ash Vardanian"},
    {email = "mike.kim@unum.cloud", name = "Mikhail Kim"},
    {email = "vladimir.orshulevich@unum.cloud", name = "Vladimir Orshulevich"},
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "License :: OSI Approved :: Apache Software License",
    "Natural Language :: Chinese (Simplified)",
    "Natural Language :: English",
    "Natural Language :: French",
    "Natural Language :: German",
    "Natural Language :: Italian",
    "Natural Language :: Japanese",
    "Natural Language :: Korean",
    "Natural Language :: Polish",
    "Natural Language :: Russian",
    "Natural Language :: Spanish",
    "Natural Language :: Turkish",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
# Base install = the CPU inference path: pure-Python multimodal encoders over huggingface_hub
# weights, tokenizers, Pillow decode, and SimSIMD similarity. GPU inference and the GPU training +
# data-tooling paths layer on through the optional-dependency groups below.
dependencies = [
    "huggingface_hub>=0.16.4",
    "tokenizers>=0.13.3",
    "pillow",
    "simsimd",
    "numpy>=1.24.0,<3.0.0",
]
description = "Pocket-Sized Multimodal AI: CPU + GPU inference and GPU training for content understanding and generation"
maintainers = [
    {email = "info@unum.cloud", name = "Unum Cloud"},
]
name = "uform"
readme = "README.md"
# The floor is 3.12: the GPU training + data path (torch 2.12, RAPIDS cu13, the PEP 723 `scripts/data/`
# scripts) requires it.
requires-python = ">=3.12"
version = "4.0.0"

[project.optional-dependencies]
# GPU inference backends
torch = ["torch>=2.7.0", "torchvision", "transformers>=4.50.0"]
onnx = ["onnx>=1.16.0", "onnxruntime>=1.20.0"]
onnx-gpu = ["onnx>=1.16.0", "onnxruntime-gpu>=1.20.0", "tensorrt-cu12>=10.0.0; platform_system=='Linux'"]

# GPU training + data tooling
# Everything a training run and the `scripts/data/` loaders / repack scripts need. The `cuda-toolkit`
# extras ship cudart / cublas / cufft / cufile / curand / cusparse / nvrtc / nvjitlink / nvcc / nvvm
# as wheels so the native extension resolves them from inside `.venv` (via $ORIGIN RPATH) with no
# system CUDA install; RAPIDS cuDF / RMM come from the [[tool.uv.index]] NVIDIA index below.
train = [
    "torch>=2.12.0",
    "cudf-cu13>=26.4.0",
    "cupy-cuda13x>=14.1.0",
    "rmm-cu13>=26.4.0",
    "pyarrow>=24.0.0",
    "safetensors>=0.4.5",
    "cuda-toolkit[cccl,cublas,cudart,cufft,cufile,curand,cusparse,nvcc,nvjitlink,nvrtc,nvtx,nvvm]>=13.0.2",
    "nvidia-cudnn-cu13>=9.20",
    "nvidia-nvimgcodec-cu13>=0.8",
    "zstandard>=0.23.0",
    "usearch>=2.16.0",
    # Load-bearing under torch 2.12 + cupy 14.1: cupy's testing hooks import pytest during torch init.
    "pytest>=8.0",
]

# Offline dataset download / pre-processing extras — pulled in only when running the `scripts/data/`
# mining and repack scripts (video first-frame decode, tar -> parquet sweeps, hard-negative mining).
mining = [
    "av>=17.0",
    "transformers>=5.9.0",
    "pandas>=2.2.0",
    "orjson>=3.11.9",
    "xxhash>=3.7.0",
    "yt-dlp",
]

# Evaluation extras — heavy benchmark libraries for the MTEB / BEIR eval suites; not needed to train.
eval = ["mteb>=1.40.0", "datasets>=4.8.0", "scipy>=1.14.0"]

# Development tooling for both the inference package and the training / data code.
dev = [
    "mypy>=1.14.0",
    "pre-commit>=4.0.0",
    "pandas",
    "requests",
    "tabulate",
    "psutil>=5.9.0",
    "nvidia-ml-py>=12.535.0",
]

[project.urls]
"Homepage" = "https://github.com/unum-cloud/UForm"

# Groups rather than extras, so none of this reaches the published wheel's metadata.
[dependency-groups]
lint = ["clang-format==22.*", "cmakelang", "ruff>=0.15.8"]
# The `scripts/data/test_*.py` suites import only the standard library and their sibling modules.
test = ["pytest>=8"]

[tool.pytest.ini_options]
# `-p no:randomly` keeps `<PROJECT>_SEED` in charge wherever pytest-randomly happens to be installed.
addopts = ["-ra", "--showlocals", "--strict-markers", "--strict-config", "-p", "no:randomly"]
filterwarnings = ["error"]
minversion = "8.0"
python_files = ["test_*.py"]
testpaths = ["scripts/data"]
xfail_strict = true

# RAPIDS cuDF / RMM and the versioned NVIDIA CUDA wheels live on NVIDIA's index alongside PyPI.
[[tool.uv.index]]
name = "nvidia"
url = "https://pypi.nvidia.com"

# The pip wheel ships the `uform` inference package only; `scripts/data/` is repo-resident tooling run
# via `uv run` from the root, not published in the wheel.
[tool.setuptools.packages.find]
where = ["python"]
include = ["uform"]
namespaces = false

[tool.ruff]
line-length = 120

[tool.ruff.lint]
ignore = ["C408", "C901", "E501", "E741"]
select = ["C", "D", "E", "F", "I", "PLC0415", "TID", "UP", "W"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.isort]
known-first-party = ["uform"]
combine-as-imports = true

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E401"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.tomlsort]
all = true
in_place = true
spaces_before_inline_comment = 2
spaces_indent_inline_array = 4
trailing_comma_inline_array = true
