# This file configures wheels compilation for `cibuildwheel` for the UForm CPython bindings:
#   - `macos` wheels for x86_64, arm64, and universal2;
#   - `windows` wheels for AMD64 and ARM64;
#   - `manylinux` and `musllinux` wheels for Linux on x86_64 and aarch64;
#   * for CPython 3.12 to 3.15, including free-threaded 3.14t and 3.15t.
[build-system]
build-backend = "scikit_build_core.build"
requires = ["scikit-build-core>=0.10"]

[project]
authors = [
    {email = "ash.vardanian@unum.cloud", name = "Ash Vardanian"},
    {email = "mike.kim@unum.cloud", name = "Mikhail Kim"},
    {email = "vladimir.orshulevich@unum.cloud", name = "Vladimir Orshulevich"},
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "License :: OSI Approved :: Apache Software License",
    "Natural Language :: English",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: Unix",
    "Programming Language :: C",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: Free Threading :: 3 - Stable",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Typing :: Typed",
]
# None. CMake links the C library into the extension, so the wheel is self-contained: inputs arrive through the
# buffer protocol, which is CPython's own, and NumPy is a convenience of the caller rather than of the model.
dependencies = []
description = "Pocket-Sized Multimodal AI: CPU + GPU inference and GPU training for content understanding and generation"
dynamic = ["version"]
maintainers = [
    {email = "info@unum.cloud", name = "Unum Cloud"},
]
name = "uform"
readme = "README.md"
requires-python = ">=3.12"

[project.optional-dependencies]
# GPU training + data tooling
# Everything a training run and the `scripts/data/` loaders / repack scripts need. The `cuda-toolkit`
# extras ship cudart / cublas / cufft / cufile / curand / cusparse / nvrtc / nvjitlink / nvcc / nvvm
# as wheels so the native extension resolves them from inside `.venv` (via $ORIGIN RPATH) with no
# system CUDA install; RAPIDS cuDF / RMM come from the [[tool.uv.index]] NVIDIA index below.
train = [
    "torch>=2.12.0",
    "cudf-cu13>=26.4.0",
    "cupy-cuda13x>=14.1.0",
    "rmm-cu13>=26.4.0",
    "pyarrow>=24.0.0",
    "safetensors>=0.4.5",
    "cuda-toolkit[cccl,cublas,cudart,cufft,cufile,curand,cusparse,nvcc,nvjitlink,nvrtc,nvtx,nvvm]>=13.0.2",
    "nvidia-nvimgcodec-cu13>=0.8",
    "zstandard>=0.23.0",
    "usearch>=2.16.0",
    # Load-bearing under torch 2.12 + cupy 14.1: cupy's testing hooks import pytest during torch init.
    "pytest>=8.0",
]

# Offline dataset download / pre-processing extras — pulled in only when running the `scripts/data/`
# mining and repack scripts (video first-frame decode, tar -> parquet sweeps, hard-negative mining).
mining = [
    "av>=17.0",
    "transformers>=5.9.0",
    "pandas>=2.2.0",
    "orjson>=3.11.9",
    "xxhash>=3.7.0",
    "yt-dlp",
]

# Evaluation extras — heavy benchmark libraries for the MTEB / BEIR eval suites; not needed to train.
eval = ["mteb>=1.40.0", "datasets>=4.8.0", "scipy>=1.14.0"]

# Development tooling for both the inference package and the training / data code.
dev = [
    "mypy>=1.14.0",
    "pre-commit>=4.0.0",
    "pandas",
    "requests",
    "tabulate",
    "psutil>=5.9.0",
    "nvidia-ml-py>=12.535.0",
]

[project.urls]
"Homepage" = "https://github.com/unum-cloud/UForm"

# One CMake tree serves the C library and the extension, so the SDK has one native build rather than a second one
# described in a `setup.py`.
[tool.scikit-build]
build-dir = "build_python/{wheel_tag}"
build.targets = ["uform_python"]
cmake.version = ">=3.28"
install.components = ["uform_python"]
minimum-version = "build-system.requires"
wheel.packages = ["python/uform"]

[tool.scikit-build.cmake.define]
CMAKE_C_COMPILER = "clang-22"
CMAKE_CXX_COMPILER = "clang++-22"
UFORM_BUILD_PYTHON = "ON"

# `VERSION` is what every other SDK reads, so the wheel takes its version from the same file rather than from a second
# copy that drifts.
[tool.scikit-build.metadata.version]
input = "VERSION"
provider = "scikit_build_core.metadata.regex"
regex = "(?P<value>.+)"

[tool.cibuildwheel]
build = "cp312-* cp313-* cp314-* cp314t-* cp315-* cp315t-*"
build-verbosity = 0
test-command = "python -X faulthandler -m pytest -x {project}/test/python"
test-groups = ["test"]

[tool.cibuildwheel.linux]
archs = ["x86_64", "aarch64"]
before-build = ["rm -rf {project}/CMakeCache.txt {project}/build_python {project}/.pytest_cache"]
# Newer images carry the newer compilers the C++23 sources need.
manylinux-aarch64-image = "manylinux_2_28"
manylinux-x86_64-image = "manylinux_2_28"
musllinux-aarch64-image = "musllinux_1_2"
musllinux-x86_64-image = "musllinux_1_2"
repair-wheel-command = "auditwheel repair --lib-sdir . -w {dest_dir} {wheel}"

[tool.cibuildwheel.macos]
archs = ["x86_64", "universal2", "arm64"]
before-build = ["rm -rf {project}/CMakeCache.txt {project}/build_python {project}/.pytest_cache"]
repair-wheel-command = "delocate-wheel --require-archs {delocate_archs} -w {dest_dir} -v {wheel}"

[tool.cibuildwheel.windows]
archs = ["AMD64", "ARM64"]
before-build = ["rd /s /q {project}\\build_python {project}\\.pytest_cache || echo Done"]

# Groups rather than extras, so none of this reaches the published wheel's metadata.
[dependency-groups]
lint = ["clang-format==22.*", "cmakelang", "ruff>=0.15.8"]
# The `scripts/data/test_*.py` suites import only the standard library and their sibling modules, and the
# `test/python` suites only the extension.
test = ["pytest>=8"]

[tool.pytest.ini_options]
# `-p no:randomly` keeps `<PROJECT>_SEED` in charge wherever pytest-randomly happens to be installed.
addopts = ["-ra", "--showlocals", "--strict-markers", "--strict-config", "-p", "no:randomly"]
filterwarnings = ["error"]
minversion = "8.0"
python_files = ["test_*.py", "*/test/python/*.py"]
testpaths = ["scripts/data", "test/python"]
xfail_strict = true

# RAPIDS cuDF / RMM and the versioned NVIDIA CUDA wheels live on NVIDIA's index alongside PyPI.
[[tool.uv.index]]
name = "nvidia"
url = "https://pypi.nvidia.com"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
ignore = ["C408", "C901", "E501", "E741"]
select = ["C", "D", "E", "F", "I", "PLC0415", "TID", "UP", "W"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.isort]
known-first-party = ["uform"]
combine-as-imports = true

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E401"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.tomlsort]
all = true
in_place = true
spaces_before_inline_comment = 2
spaces_indent_inline_array = 4
trailing_comma_inline_array = true
